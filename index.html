<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dada's Calendar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d5afe">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #faf9f7;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, Roboto, Arial, sans-serif;
    }
    .card { text-align: center; padding: 24px; }
    img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 18px; }
    h1 { font-size: 20px; margin: 0 0 6px; color: #262521; }
    p { font-size: 14px; color: #6b6a63; margin: 0 0 22px; }
    button {
      font-size: 16px; font-weight: 600; color: white;
      background: #3d5afe; border: none; border-radius: 14px;
      padding: 14px 32px; cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" alt="">
    <h1>Dada's Calendar</h1>
    <p id="subtitle">Tap below to open, or install this as an app first.</p>
    <button onclick="goToCalendar()">Open calendar</button>
  </div>

  <script>
    const CALENDAR_URL = 'https://script.google.com/macros/s/AKfycbwupe8SJtb0d2DYENqPyAsiDBNtMVGAqRF0Ta1s7O1eBeSuLhah0b5GZVij4rxzmqDATA/exec';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function goToCalendar() {
      window.location.replace(CALENDAR_URL);
    }

    // Only auto-redirect when already launched as the installed app.
    // In a normal browser tab, stay put so Chrome can offer "Install app".
    if (isStandalone()) {
      goToCalendar();
    }
  </script>
</body>
</html>
